<!DOCTYPE html>
<html>
<head>
    <title>Interview Preparation Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="nav">
    <div class="logo">
        <h2>Prep Hub</h2>
        <p>Interview Preparation Hub</p>
    </div>

    <!-- FILTER OPTIONS (acts like search) -->
    <div class="filters">
        <label><input type="radio" name="filter" checked> All</label>
        <label><input type="radio" name="filter" id="htmlBtn"> HTML</label>
        <label><input type="radio" name="filter" id="cssBtn"> CSS</label>
        <label><input type="radio" name="filter" id="jsBtn"> JS</label>
        <label><input type="radio" name="filter" id="javaBtn"> Java</label>
        <label><input type="radio" name="filter" id="sqlBtn"> SQL</label>
    </div>
</div>

<!-- MAIN -->
<div class="container">

    <div class="cards">

        <a href="html.html" class="card html">
            <h3>📄 HTML</h3>
            <p>Structure of web pages</p>
        </a>

        <a href="css.html" class="card css">
            <h3>🎨 CSS</h3>
            <p>Design and layouts</p>
        </a>

        <a href="javascript.html" class="card js">
            <h3>⚡ JavaScript</h3>
            <p>Logic & DOM</p>
        </a>

        <a href="java.html" class="card java">
            <h3>☕ Java</h3>
            <p>OOP & backend basics</p>
        </a>

        <a href="sql.html" class="card sql">
            <h3>🗄️ SQL</h3>
            <p>Queries & database</p>
        </a>

        <a href="spring.html" class="card java">
            <h3>🌱 Spring</h3>
            <p>Backend development</p>
        </a>

    </div>

</div>

<div class="footer">
    <p>Simple Interview Prep Dashboard</p>
</div>

</body>
</html>
